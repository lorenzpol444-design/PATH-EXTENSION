<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Path AI</title>
  <style>
    body { width: 260px; padding: 16px; font-family: 'Segoe UI', system-ui, sans-serif; background: #0f172a; color: #e2e8f0; margin: 0; }
    h1 { font-size: 18px; margin: 0 0 16px; display: flex; align-items: center; gap: 8px; }
    .logo { width: 28px; height: 28px; background: linear-gradient(135deg, #6366f1, #a855f7); border-radius: 6px; display: flex; align-items: center; justify-content: center; }
    .menu-btn { width: 100%; padding: 14px; border: none; border-radius: 10px; background: linear-gradient(135deg, #6366f1, #a855f7); color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; transition: all .2s; display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .menu-btn:hover { opacity: .9; transform: translateY(-1px); }
    .menu-btn:active { transform: translateY(0); }
    .settings-btn { width: 100%; padding: 14px; border: 1px solid #334155; border-radius: 10px; background: #1e293b; color: #e2e8f0; font-size: 15px; font-weight: 600; cursor: pointer; transition: all .2s; display: flex; align-items: center; gap: 10px; }
    .settings-btn:hover { background: #334155; }
    .status { font-size: 12px; margin-top: 10px; text-align: center; color: #22c55e; min-height: 16px; }
  </style>
</head>
<body>
  <h1>
    <span class="logo">
      <svg width="16" height="16" viewBox="0 0 48 48" fill="none">
        <circle cx="24" cy="24" r="20" stroke="#fff" stroke-width="3" fill="none" opacity="0.3"/>
        <path d="M16 32 L24 16 L32 32 Z" fill="#fff"/>
        <circle cx="24" cy="24" r="4" fill="#fff"/>
      </svg>
    </span>
    Path AI
  </h1>
  <button class="menu-btn" id="openSidePanel">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2">
      <rect x="3" y="3" width="18" height="18" rx="2"/>
      <line x1="15" y1="3" x2="15" y2="21"/>
    </svg>
    Side Panel
  </button>
  <button class="menu-btn" id="openMenu">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2">
      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
    </svg>
    Ask AI
  </button>
  <button class="settings-btn" id="openSettings">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#a5b4fc" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg> Settings
  </button>
  <div class="status" id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
